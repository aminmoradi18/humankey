# Builds the phone app (mobile/) as an installable Android APK. Run it from the Actions tab; the APK is
# attached to the run as an artifact. Release build, signed with Expo's debug key (for testing, not the store).
name: apk
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: humankey-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
